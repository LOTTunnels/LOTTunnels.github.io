<script>
    async function findGitHubContributors() {
        const container = document.getElementById("contributors");
        if (!container) return;

        const PATTERN = /<([^>]+)>; rel="next"/
        let next_page = 'https://api.github.com/repos/LOTTunnels/LOTTunnels.github.io/contributors?anon=false';
        let contributors = [];

        while (next_page) {
            let githubApi = await fetch(next_page, {
                headers: {
                    'Accept': 'application/vnd.github+json'
                }
            });
            next_page = (PATTERN.exec(githubApi.headers.get("link")) || [null, null])[1];
            const pageContributors = await githubApi.json();
            contributors.push(...pageContributors);
        }

        contributors
            .sort((a, b) => b.contributions - a.contributions)
            .forEach(function (contributor) {
                const card = document.createElement('div');
                card.className = 'contributor-card';
                card.innerHTML = `
                    <a class="contributor-avatar" href="https://github.com/${contributor.login}" target="_blank" rel="noopener noreferrer">
                        <img src="https://avatars.githubusercontent.com/u/${contributor.id}?s=120&v=4" alt="Avatar of ${contributor.login}">
                    </a>
                    <div class="contributor-meta">
                        <a class="contributor-name" href="https://github.com/${contributor.login}" target="_blank" rel="noopener noreferrer">${contributor.login}</a>
                        <a class="contributor-count" href="https://github.com/LOTTunnels/LOTTunnels.github.io/commits?author=${contributor.login}" target="_blank" rel="noopener noreferrer">
                            ${contributor.contributions} contribution${contributor.contributions === 1 ? '' : 's'}
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
    }
    findGitHubContributors();
</script>

<p>We thank everyone who has contributed to this project via our <a href="https://github.com/LOTTunnels/LOTTunnels.github.io">GitHub repository</a>:</p>
<div id="contributors" class="contributors-grid"></div>
